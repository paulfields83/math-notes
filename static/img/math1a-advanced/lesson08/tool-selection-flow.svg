<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 560"><style>text{font-family:serif;fill:#111}.b{fill:white;stroke:#111;stroke-width:2}.l{stroke:#111;stroke-width:1.8;fill:none}.s{font-size:21px}.h{font-size:25px}</style><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111"/></marker></defs><rect class="b" x="405" y="20" width="240" height="60" rx="12"/><text class="h" x="525" y="58" text-anchor="middle">先判断题面信号</text><rect class="b" x="40" y="125" width="260" height="60" rx="10"/><text class="s" x="170" y="162" text-anchor="middle">最大・最小＋区间</text><rect class="b" x="395" y="125" width="260" height="60" rx="10"/><text class="s" x="525" y="162" text-anchor="middle">两个实根 / 相切</text><rect class="b" x="750" y="125" width="260" height="60" rx="10"/><text class="s" x="880" y="162" text-anchor="middle">根的位置</text><rect class="b" x="40" y="220" width="260" height="60" rx="10"/><text class="s" x="170" y="257" text-anchor="middle">对称轴＋定义域</text><rect class="b" x="395" y="220" width="260" height="60" rx="10"/><text class="s" x="525" y="257" text-anchor="middle">判别式 D</text><rect class="b" x="750" y="220" width="260" height="60" rx="10"/><text class="s" x="880" y="257" text-anchor="middle">D＋轴＋f(p)</text><rect class="b" x="40" y="340" width="260" height="60" rx="10"/><text class="s" x="170" y="377" text-anchor="middle">|f(x)|=k</text><rect class="b" x="395" y="340" width="260" height="60" rx="10"/><text class="s" x="525" y="377" text-anchor="middle">恒成立</text><rect class="b" x="750" y="340" width="260" height="60" rx="10"/><text class="s" x="880" y="377" text-anchor="middle">二变量 / x⁴,x²</text><rect class="b" x="40" y="455" width="260" height="70" rx="10"/><text class="s" x="170" y="496" text-anchor="middle">绝对值图像＋水平线</text><rect class="b" x="395" y="455" width="260" height="70" rx="10"/><text class="s" x="525" y="482" text-anchor="middle">全实数：全局最值 / 判别式</text><text class="s" x="525" y="510" text-anchor="middle">有限区间：区间最值</text><rect class="b" x="750" y="455" width="260" height="70" rx="10"/><text class="s" x="880" y="482" text-anchor="middle">消元 或 t=x²</text><text class="s" x="880" y="510" text-anchor="middle">并重写定义域</text><g marker-end="url(#arr)"><path class="l" d="M470 80 L210 125"/><path class="l" d="M525 80 L525 125"/><path class="l" d="M580 80 L840 125"/><path class="l" d="M170 185 L170 220"/><path class="l" d="M525 185 L525 220"/><path class="l" d="M880 185 L880 220"/><path class="l" d="M170 280 L170 340"/><path class="l" d="M525 280 L525 340"/><path class="l" d="M880 280 L880 340"/><path class="l" d="M170 400 L170 455"/><path class="l" d="M525 400 L525 455"/><path class="l" d="M880 400 L880 455"/></g></svg>