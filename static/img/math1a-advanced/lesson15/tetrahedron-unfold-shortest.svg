<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
<rect width="100%" height="100%" fill="white"/>
<text x="24" y="30" font-size="18" font-weight="600">正四面体の表面最短経路｜3面を展開する</text>
<g stroke="#222" stroke-width="2" fill="none">
  <polygon points="150,210 350,210 250,36.8"/>
  <polygon points="150,210 350,210 250,383.2"/>
  <polygon points="350,210 250,383.2 450,383.2"/>
</g>
<line x1="250" y1="36.8" x2="350" y2="383.2" stroke="#666" stroke-width="2.5"/>
<circle cx="300" cy="210" r="5" fill="#333"/>
<circle cx="316.7" cy="267.7" r="5" fill="#333"/>
<g font-family="sans-serif" font-size="14">
  <text x="240" y="28">A</text>
  <text x="135" y="230">B</text>
  <text x="355" y="225">C</text>
  <text x="238" y="405">D</text>
  <text x="455" y="398">A'</text>
  <text x="288" y="202">P</text>
  <text x="324" y="267">Q</text>
  <text x="357" y="383">M</text>
</g>
<text x="520" y="105" font-size="14">BC, CD を順に展開</text>
<text x="520" y="135" font-size="14">A と M を一直線で結ぶ</text>
<text x="24" y="420" font-size="12" fill="#666">展開後：PはBC上、QはCD上。直線 AM が表面上の最短経路に対応する。</text>
</svg>