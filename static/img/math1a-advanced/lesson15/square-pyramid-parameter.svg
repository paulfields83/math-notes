<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430">
<rect width="100%" height="100%" fill="white"/>
<text x="24" y="30" font-size="18" font-weight="600">正四角锥 PABCD｜侧棱与高的夹角</text>
<!-- square base -->
<g stroke="#222" stroke-width="2" fill="none">
  <polygon points="185,310 470,330 585,245 305,225"/>
  <line x1="385" y1="70" x2="185" y2="310"/>
  <line x1="385" y1="70" x2="470" y2="330"/>
  <line x1="385" y1="70" x2="585" y2="245"/>
  <line x1="385" y1="70" x2="305" y2="225"/>
</g>
<!-- diagonals -->
<g stroke="#888" stroke-width="1.3" stroke-dasharray="5 4">
  <line x1="185" y1="310" x2="585" y2="245"/>
  <line x1="305" y1="225" x2="470" y2="330"/>
</g>
<!-- height -->
<line x1="385" y1="70" x2="386" y2="270" stroke="#555" stroke-width="1.8"/>
<path d="M386 270 l16 2 l0 -16" stroke="#555" stroke-width="1.4" fill="none"/>
<!-- angle arc -->
<path d="M 386 118 A 52 52 0 0 1 347 105" stroke="#555" stroke-width="1.4" fill="none"/>
<text x="344" y="121" font-size="14">θ</text>
<!-- labels -->
<g font-family="sans-serif" font-size="15" fill="#111">
  <text x="376" y="57">P</text>
  <text x="165" y="330">A</text>
  <text x="465" y="350">B</text>
  <text x="594" y="247">C</text>
  <text x="294" y="215">D</text>
  <text x="392" y="282">H</text>
</g>
<g font-family="sans-serif" font-size="13" fill="#444">
  <text x="270" y="175">PA=a</text>
  <text x="400" y="170">PH</text>
</g>
<text x="24" y="408" font-size="12" fill="#666">H为正方形ABCD的中心，PH ⟂ 平面ABCD；示意图不按比例绘制。</text>
</svg>