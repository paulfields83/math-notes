<svg xmlns="http://www.w3.org/2000/svg" width="820" height="460" viewBox="0 0 820 460">
<rect width="100%" height="100%" fill="white"/>
<text x="24" y="30" font-size="18" font-weight="600">直方体 ABCD-EFGH｜截面三角形 ACF</text>

<!-- front/back cuboid -->
<g stroke="#222" stroke-width="2" fill="none">
  <polygon points="150,300 430,320 560,235 280,215"/>
  <polygon points="150,160 430,180 560,95 280,75"/>
  <line x1="150" y1="300" x2="150" y2="160"/>
  <line x1="430" y1="320" x2="430" y2="180"/>
  <line x1="560" y1="235" x2="560" y2="95"/>
  <line x1="280" y1="215" x2="280" y2="75"/>
</g>

<!-- highlighted section ACF -->
<polygon points="150,300 560,235 430,180" fill="#eeeeee" stroke="#555" stroke-width="2"/>
<line x1="150" y1="300" x2="560" y2="235" stroke="#555" stroke-width="2"/>
<line x1="560" y1="235" x2="430" y2="180" stroke="#555" stroke-width="2"/>
<line x1="430" y1="180" x2="150" y2="300" stroke="#555" stroke-width="2"/>

<g font-family="sans-serif" font-size="15" fill="#111">
  <text x="132" y="322">A</text>
  <text x="430" y="340">B</text>
  <text x="567" y="244">C</text>
  <text x="267" y="230">D</text>
  <text x="132" y="154">E</text>
  <text x="430" y="174">F</text>
  <text x="567" y="93">G</text>
  <text x="267" y="69">H</text>
</g>

<g font-family="sans-serif" font-size="13" fill="#444">
  <text x="275" y="332">AB</text>
  <text x="206" y="266">AD</text>
  <text x="118" y="235">AE</text>
</g>

<text x="24" y="430" font-size="12" fill="#666">先从立体图中抽出 △ACF，再把问题还原成平面三角形。示意图不按比例绘制。</text>
</svg>