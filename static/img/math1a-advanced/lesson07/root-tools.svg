<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 330"><style>text{font-family:serif;fill:#111}.a{stroke:#111;stroke-width:2;fill:none}.g{stroke:#999;stroke-width:1.3;stroke-dasharray:6 6}.s{font-size:20px}.h{font-size:23px}.p{fill:#111}</style><g transform="translate(10,0)"><text class="h" x="155" y="28" text-anchor="middle">① 判别式 D：先确认根的个数</text><g transform="translate(0,35)"><line class="a" x1="10" y1="120" x2="95" y2="120"/><line class="a" x1="52" y1="55" x2="52" y2="180"/><path class="a" d="M18 70 Q52 160 86 70"/><text class="s" x="52" y="210" text-anchor="middle">D&lt;0</text><line class="a" x1="110" y1="120" x2="195" y2="120"/><line class="a" x1="152" y1="55" x2="152" y2="180"/><path class="a" d="M118 70 Q152 120 186 70"/><text class="s" x="152" y="210" text-anchor="middle">D=0</text><line class="a" x1="210" y1="120" x2="295" y2="120"/><line class="a" x1="252" y1="55" x2="252" y2="180"/><path class="a" d="M218 70 Q252 170 286 70"/><text class="s" x="252" y="210" text-anchor="middle">D&gt;0</text></g></g><g transform="translate(350,0)"><text class="h" x="160" y="28" text-anchor="middle">② 对称轴：两个根的中心</text><line class="a" x1="15" y1="150" x2="315" y2="150"/><line class="a" x1="55" y1="50" x2="55" y2="245"/><path class="a" d="M20 70 Q165 300 310 70"/><line class="g" x1="165" y1="60" x2="165" y2="255"/><circle class="p" cx="100" cy="150" r="4"/><circle class="p" cx="230" cy="150" r="4"/><text class="s" x="88" y="140">α</text><text class="s" x="232" y="140">β</text><text class="s" x="165" y="290" text-anchor="middle">x=−b/(2a)=(α+β)/2</text></g><g transform="translate(705,0)"><text class="h" x="160" y="28" text-anchor="middle">③ f(p)：p 在根内还是根外</text><line class="a" x1="15" y1="150" x2="315" y2="150"/><line class="a" x1="55" y1="50" x2="55" y2="245"/><path class="a" d="M20 70 Q165 295 310 70"/><circle class="p" cx="95" cy="150" r="4"/><circle class="p" cx="235" cy="150" r="4"/><line class="g" x1="165" y1="150" x2="165" y2="245"/><text class="s" x="165" y="140" text-anchor="middle">p</text><text class="s" x="165" y="290" text-anchor="middle">开口向上：f(p)&lt;0 ⇒ p 在两根之间</text></g></svg>