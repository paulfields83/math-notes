<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470"><style>text{font-family:serif;fill:#111}.a{stroke:#111;stroke-width:2;fill:none}.g{stroke:#999;stroke-width:1.3;stroke-dasharray:6 6}.s{font-size:22px}.m{font-size:25px}.p{fill:#111}</style><text class="m" x="360" y="34" text-anchor="middle">f(x)=2x²−3x+1/2：端点函数值决定根所在区间</text><line class="a" x1="55" y1="300" x2="670" y2="300"/><line class="a" x1="100" y1="60" x2="100" y2="410"/><path class="a" d="M70 205 Q320 450 620 70"/><line class="g" x1="100" y1="260" x2="100" y2="300"/><line class="g" x1="350" y1="300" x2="350" y2="360"/><line class="g" x1="600" y1="85" x2="600" y2="300"/><circle class="p" cx="100" cy="260" r="5"/><circle class="p" cx="350" cy="360" r="5"/><circle class="p" cx="600" cy="85" r="5"/><text class="s" x="112" y="250">f(0)&gt;0</text><text class="s" x="365" y="375">f(1)&lt;0</text><text class="s" x="505" y="78">f(2)&gt;0</text><text class="s" x="200" y="340">一根在 (0,1)</text><text class="s" x="445" y="260">一根在 (1,2)</text><text class="s" x="94" y="330">0</text><text class="s" x="344" y="330">1</text><text class="s" x="594" y="330">2</text><text class="s" x="657" y="290">x</text><text class="s" x="110" y="75">y</text></svg>