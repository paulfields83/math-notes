<title id="t">y=f(x) 与 y=|f(x)| 的翻折关系</title><desc id="d">函数 f(x)=x²+x-2 在 x 轴下方的部分关于 x 轴翻折，得到绝对值函数图像。</desc>
<style>text{font-family:serif;fill:#111}.a{stroke:#111;stroke-width:2;fill:none}.g{stroke:#999;stroke-width:1.2;stroke-dasharray:6 6}.p{fill:#111}.s{font-size:20px}.m{font-size:25px}</style>
<g transform="translate(25,10)"><text class="m" x="205" y="26" text-anchor="middle">y=f(x)=x²+x−2</text><line class="a" x1="35" y1="160" x2="385" y2="160"/><line class="a" x1="215" y1="45" x2="215" y2="280"/><path class="a" d="M55 55 Q165 300 375 55"/><line class="g" x1="190" y1="65" x2="190" y2="275"/><circle class="p" cx="90" cy="160" r="4"/><circle class="p" cx="305" cy="160" r="4"/><circle class="p" cx="190" cy="250" r="4"/><text class="s" x="82" y="187">−2</text><text class="s" x="300" y="187">1</text><text class="s" x="198" y="255">−9/4</text><text class="s" x="370" y="151">x</text><text class="s" x="224" y="60">y</text></g>
<g transform="translate(485,10)"><text class="m" x="190" y="26" text-anchor="middle">y=|f(x)|</text><line class="a" x1="15" y1="250" x2="385" y2="250"/><line class="a" x1="205" y1="45" x2="205" y2="285"/><path class="a" d="M35 55 Q90 250 115 250 Q175 105 180 105 Q240 105 300 250 Q330 250 375 55"/><line class="g" x1="180" y1="65" x2="180" y2="270"/><circle class="p" cx="115" cy="250" r="4"/><circle class="p" cx="300" cy="250" r="4"/><circle class="p" cx="180" cy="105" r="4"/><text class="s" x="104" y="278">−2</text><text class="s" x="294" y="278">1</text><text class="s" x="188" y="110">9/4</text><text class="s" x="370" y="241">x</text><text class="s" x="214" y="60">y</text></g>
