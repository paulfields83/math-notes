<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420">
<rect width="100%" height="100%" fill="white"/>
<text x="24" y="30" font-size="18" font-weight="600">一般四角形｜自分で対角線を引いて分割する</text>
<g stroke="#222" stroke-width="2" fill="none">
<polygon points="155,315 470,330 600,150 260,95"/>
<line x1="155" y1="315" x2="600" y2="150" stroke="#666" stroke-dasharray="7 5"/>
</g>
<path d="M205 316 A48 48 0 0 0 178 274" stroke="#777" fill="none"/>
<g font-family="sans-serif" font-size="15">
<text x="140" y="338">A</text><text x="470" y="352">B</text><text x="608" y="150">C</text><text x="248" y="86">D</text>
<text x="280" y="340">AB=3</text><text x="530" y="245">BC=5</text><text x="430" y="112">CD=5</text><text x="175" y="205">DA=4</text>
<text x="185" y="292">∠B=120°</text>
</g>
<text x="24" y="398" font-size="12" fill="#666">対角線 AC を補助線として用いる。</text>
</svg>