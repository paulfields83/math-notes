<text x="470" y="408" font-size="11">示意图（不按比例）</text><polyline points="150,150 360,150 360,330 150,330 150,150" fill="none" stroke="#111" stroke-width="2"/><polyline points="235,85 445,85 445,265 235,265 235,85" fill="none" stroke="#111" stroke-width="2"/><line x1="150" y1="150" x2="235" y2="85" stroke="#111" stroke-width="2"/><line x1="360" y1="150" x2="445" y2="85" stroke="#111" stroke-width="2"/><line x1="360" y1="330" x2="445" y2="265" stroke="#111" stroke-width="2"/><line x1="150" y1="330" x2="235" y2="265" stroke="#111" stroke-width="2"/><text x="115" y="120" font-size="13">固定した1面を基準にして回転の重複を除く</text><text x="120" y="375" font-size="13">相邻面は異色。向かい合う面の条件も確認する。</text></svg>